name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyware
          POSTGRES_PASSWORD: skyware
          POSTGRES_DB: skyware_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyware -d skyware_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skyware:skyware@localhost:5432/skyware_test?schema=public
      NEXTAUTH_SECRET: ci-secret-not-used-anywhere-else
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify schema in sync
        run: pnpm exec prisma migrate status

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyware
          POSTGRES_PASSWORD: skyware
          POSTGRES_DB: skyware_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyware -d skyware_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://skyware:skyware@localhost:5432/skyware_e2e?schema=public
      NEXTAUTH_SECRET: ci-secret-not-used-anywhere-else
      NEXTAUTH_URL: http://localhost:3000
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Prisma generate
        run: pnpm db:generate

      - name: Apply schema (db push until baseline migration lands)
        run: pnpm exec prisma db push --skip-generate

      - name: Seed database
        run: pnpm db:seed

      - name: Build app
        run: pnpm build

      - name: Run E2E
        run: pnpm exec playwright test --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
